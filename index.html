  <div class=&quot;panel rules&quot;>
    <h3>⚠️ הסכנה מספר 1: סויה ומיסו</h3>
    <p>רוב <b>רוטב הסויה (שוֹיוּ)</b> ו<b>המיסו</b> ביפן מיוצרים עם <b>חיטה</b> — והם נמצאים כמעט בכל מנה מבושלת, רוטב, מרינדה, טריאקי ורוטב צלייה. זו המלכודת המרכזית.</p>
    <ul>
      <li><b>לשאת טַמַארי ללא גלוטן</b> (רוטב סויה נטול חיטה) בבקבוק נסיעה — לסושי, אורז ובשר. קונים בסופר עוד באוסקה (ראו סעיף אוסקה).</li>
      <li><b>לבקש הכנה עם מלח בלבד</b> — ביפנית &quot;שיוֹ&quot; (塩) — במקום רוטב.</li>
      <li><b>מרק מיסו ודאשי</b> — לרוב לא בטוחים (מוסיפים שוֹיוּ). לשאול תמיד.</li>
      <li><b>טמפורה, גיוזה, אודון, &quot;בשר סרטן&quot;</b> — חיטה. <b>סובה</b> — בטוח רק אם 100% כוסמת (juwari 十割).</li>
      <li><b>סושי</b> — האורז והחומץ בד״כ בטוחים; הסכנה היא הסויה ורוטב הצלופח → להשתמש בטמארי של נועה.</li>
    </ul>
    <h4>קאנג׳י לזיהוי על אריזות (סרקו עם Google Translate):</h4>
    <p><span class=&quot;kanji&quot;>小麦 = חיטה</span> <span class=&quot;kanji&quot;>醤油 = רוטב סויה</span> <span class=&quot;kanji&quot;>塩 = מלח (בטוח)</span></p>

      <li><b>לאמת יום‑יומיים לפני</b> — מקומות קטנים ביפן משנים שעות/ימי סגירה. בדקו ב‑Google Maps לפני שיוצאים.</li>

<script>
(function(){
  &quot;use strict&quot;;
  var K_URL='jjp_url', K_ENTRIES='jjp_entries', K_PENDING='jjp_pending', K_WHO='jjp_who', K_WHOLIST='jjp_wholist';
  var DEFAULT_WHO=['רן','נרקיס','נועה','עדי','עמית'];
  var state={ url:'', entries:[], pending:[], formPhotos:[], editingId:null, editingPending:false };

  function load(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  function init(){
    state.url = localStorage.getItem(K_URL) || '';
    try{
      var h = (window.parent &amp;&amp; window.parent!==window) ? window.parent.location.hash : window.location.hash;
      var m = h &amp;&amp; h.match(/[#&amp;]j=([^&amp;]+)/);
      if(m){ var u=decodeURIComponent(m[1]); if(u &amp;&amp; u.indexOf('http')===0){ state.url=u; localStorage.setItem(K_URL,u); } }
    }catch(e){}
    state.entries = load(K_ENTRIES, []);
    state.pending = load(K_PENDING, []);
    document.getElementById('fDate').value = todayStr();
    var who = localStorage.getItem(K_WHO)||''; if(who) document.getElementById('fWho').value=who;
    rebuildWhoList();
    reflectStatus();
    render();
    if(state.url){ refresh(); flushPending(); }
    else { document.getElementById('cfgCard').style.display='block'; }
  }

  function todayStr(){ var d=new Date(), p=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function uuid(){ return 'e-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*1e6).toString(36); }

  function reflectStatus(){
    var on=!!state.url;
    document.getElementById('dot').className='dot'+(on?' on':'');
    document.getElementById('statusTxt').textContent = on ? 'מחובר ל‑Google · נשמר משותף' : 'עובד מקומית — לא מחובר לענן';
    document.getElementById('shareBtn').style.display = on ? '' : 'none';
    document.getElementById('cfgUrl').value = state.url;
  }

  /* ---- config ---- */
  document.getElementById('cfgToggle').onclick=function(){ var c=document.getElementById('cfgCard'); c.style.display = c.style.display==='none'?'block':'none'; };
  document.getElementById('cfgClose').onclick=function(){ document.getElementById('cfgCard').style.display='none'; };
  document.getElementById('cfgSave').onclick=function(){
    var u=document.getElementById('cfgUrl').value.trim();
    if(u &amp;&amp; u.indexOf('http')!==0){ toast('הכתובת צריכה להתחיל ב‑https'); return; }
    state.url=u; if(u) localStorage.setItem(K_URL,u); else localStorage.removeItem(K_URL);
    reflectStatus(); document.getElementById('cfgCard').style.display='none';
    if(u){ toast('מחובר! מסנכרן…'); refresh(); flushPending(); }
  };
  document.getElementById('shareBtn').onclick=function(){
    var base;
    try{ base = (window.parent &amp;&amp; window.parent!==window) ? window.parent.location.href.split('#')[0] : window.location.href.split('#')[0]; }
    catch(e){ base = window.location.href.split('#')[0]; }
    copy(base + '#j=' + encodeURIComponent(state.url));
  };

  /* ---- photos: pick + downscale ---- */
  document.getElementById('fPhotos').addEventListener('change', function(ev){
    var files = Array.prototype.slice.call(ev.target.files||[]); ev.target.value='';
    if(!files.length) return;
    document.getElementById('photoHint').textContent='מקטין תמונות…';
    var done=0;
    files.forEach(function(f){
      if(f.type.indexOf('image')!==0){ done++; return; }
      downscale(f, 1200, 0.82, function(dataUrl){
        if(dataUrl) state.formPhotos.push({type:'data', data:dataUrl});
        renderThumbs();
        done++; if(done===files.length) document.getElementById('photoHint').textContent='כל תמונה מוקטנת אוטומטית לפני שמירה';
      });
    });
  });

  function downscale(file, maxW, quality, cb){
    var img=new Image(); var url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width, h=img.height; if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      try{ cb(c.toDataURL('image/jpeg', quality)); }catch(e){ cb(null); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); cb(null); };
    img.src=url;
  }

  function renderThumbs(){
    var box=document.getElementById('thumbs'); box.innerHTML='';
    state.formPhotos.forEach(function(p,i){
      var src = p.type==='data' ? p.data : photoUrl(p.id,false);
      var t=document.createElement('div'); t.className='thumb';
      t.innerHTML='<img src=&quot;'+src+'&quot;><button title=&quot;הסר&quot;>✕</button>';
      t.querySelector('button').onclick=function(){ state.formPhotos.splice(i,1); renderThumbs(); };
      box.appendChild(t);
    });
  }

  /* ---- save (new or edit) ---- */
  document.getElementById('saveBtn').onclick=function(){
    var loc=document.getElementById('fLoc').value.trim();
    var text=document.getElementById('fText').value.trim();
    var who=document.getElementById('fWho').value.trim();
    var date=document.getElementById('fDate').value || todayStr();
    if(!loc &amp;&amp; !text &amp;&amp; !state.formPhotos.length){ toast('צריך לפחות מיקום, טקסט או תמונה'); return; }
    if(who){ localStorage.setItem(K_WHO, who); addWho(who); }

    if(state.editingId){ saveEdit(loc,text,who,date); }
    else { saveNew(loc,text,who,date); }
  };

  function saveNew(loc,text,who,date){
    var localData = state.formPhotos.filter(function(p){return p.type==='data';}).map(function(p){return p.data;});
    var entry={ id:uuid(), created:new Date().toISOString(), date:date, location:loc, author:who,
      text:text, photos:[], localPhotos:localData, pending:true };
    state.pending.push(entry); save(K_PENDING, state.pending);
    resetForm(); render(); toast('נשמר ✓'); upload(entry);
  }

  function saveEdit(loc,text,who,date){
    var id=state.editingId;
    var keepIds = state.formPhotos.filter(function(p){return p.type==='id';}).map(function(p){return p.id;});
    var newData = state.formPhotos.filter(function(p){return p.type==='data';}).map(function(p){return p.data;});

    if(state.editingPending){
      // רשומה שעוד לא סונכרנה — עדכון מקומי בלבד
      var pe=findIn(state.pending,id);
      if(pe){ pe.location=loc; pe.text=text; pe.author=who; pe.date=date;
        pe.localPhotos = newData.slice(); }   // בעריכה מקומית התמונות הן ה-dataURL הנוכחיים
      save(K_PENDING, state.pending);
      resetForm(); render(); toast('עודכן ✓');
      // אם התחברנו בינתיים — יעלה ברענון הבא
      return;
    }
    // רשומת שרת — עדכון אופטימי + upsert
    var se=findIn(state.entries,id);
    if(se){ se.location=loc; se.text=text; se.author=who; se.date=date; se.photos=keepIds.slice(); }
    save(K_ENTRIES, state.entries);
    resetForm(); render(); toast('מעדכן…');
    upsert({ id:id, date:date, location:loc, author:who, text:text, keepPhotos:keepIds, photos:newData });
  }

  function startEdit(id){
    var e=findIn(state.entries,id); var pending=false;
    if(!e){ e=findIn(state.pending,id); pending=true; }
    if(!e) return;
    state.editingId=id; state.editingPending=pending;
    document.getElementById('fLoc').value=e.location||'';
    document.getElementById('fText').value=e.text||'';
    document.getElementById('fWho').value=e.author||'';
    document.getElementById('fDate').value=e.date||todayStr();
    if(pending){ state.formPhotos=(e.localPhotos||[]).map(function(d){return {type:'data',data:d};}); }
    else { state.formPhotos=(e.photos||[]).map(function(id){return {type:'id',id:id};}); }
    renderThumbs();
    document.getElementById('formCard').classList.add('editing');
    document.getElementById('formTitle').textContent='עריכת רשומה';
    document.getElementById('saveBtn').textContent='עדכן רשומה';
    document.getElementById('cancelEditBtn').style.display='';
    document.getElementById('formCard').scrollIntoView({behavior:'smooth', block:'start'});
  }
  document.getElementById('cancelEditBtn').onclick=resetForm;

  function resetForm(){
    state.editingId=null; state.editingPending=false; state.formPhotos=[];
    document.getElementById('fLoc').value=''; document.getElementById('fText').value='';
    document.getElementById('fDate').value=todayStr();
    renderThumbs();
    document.getElementById('formCard').classList.remove('editing');
    document.getElementById('formTitle').textContent='רשומה חדשה';
    document.getElementById('saveBtn').textContent='שמור ליומן';
    document.getElementById('cancelEditBtn').style.display='none';
  }

  /* ---- delete ---- */
  function deleteEntry(id){
    var e=findIn(state.entries,id) || findIn(state.pending,id); if(!e) return;
    var label = e.location ? ('&quot;'+e.location+'&quot;') : 'הרשומה';
    if(!confirm('למחוק את '+label+'? הפעולה בלתי הפיכה.')) return;
    state.pending = state.pending.filter(function(x){return x.id!==id;});
    var wasServer = !!findIn(state.entries,id);
    state.entries = state.entries.filter(function(x){return x.id!==id;});
    save(K_PENDING, state.pending); save(K_ENTRIES, state.entries);
    if(state.editingId===id) resetForm();
    render(); toast('נמחק ✓');
    if(wasServer &amp;&amp; state.url){
      fetch(state.url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'delete', id:id}) }).catch(function(){});
    }
  }

  /* ---- sync ---- */
  function upload(entry){
    if(!state.url) return;
    upsert({ action:'add', id:entry.id, date:entry.date, location:entry.location,
      author:entry.author, text:entry.text, photos:entry.localPhotos||[] });
  }
  function upsert(payload){
    if(!state.url) return;
    payload.action='add';
    fetch(state.url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload) }).then(function(){ setTimeout(refresh, 2000); }).catch(function(){});
  }
  function flushPending(){ if(!state.url) return; state.pending.forEach(function(e){ upload(e); }); }

  var jsonpN=0;
  function refresh(){
    if(!state.url) return;
    var cbName='__jjp_cb_'+(++jsonpN);
    var s=document.createElement('script');
    var to=setTimeout(cleanup, 12000);
    function cleanup(){ try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); clearTimeout(to); }
    window[cbName]=function(res){
      cleanup();
      if(res &amp;&amp; res.ok &amp;&amp; res.entries){
        state.entries = res.entries; save(K_ENTRIES, state.entries);
        var ids={}; state.entries.forEach(function(e){ ids[e.id]=1; });
        state.pending = state.pending.filter(function(e){ return !ids[e.id]; });
        save(K_PENDING, state.pending);
        state.entries.forEach(function(e){ if(e.author) addWho(e.author); });
        render();
      }
    };
    s.src = state.url + (state.url.indexOf('?')>-1?'&amp;':'?') + 'callback='+cbName+'&amp;t='+Date.now();
    s.onerror=function(){ cleanup(); };
    document.body.appendChild(s);
  }
  document.getElementById('refreshBtn').onclick=function(){ if(state.url){ toast('מרענן…'); refresh(); flushPending(); } else toast('לא מחובר לענן'); };

  /* ---- who list ---- */
  function addWho(name){ var l=load(K_WHOLIST,[]); if(l.indexOf(name)===-1){ l.push(name); save(K_WHOLIST,l); rebuildWhoList(); } }
  function rebuildWhoList(){
    var stored=load(K_WHOLIST,[]); var all=DEFAULT_WHO.slice();
    stored.forEach(function(n){ if(all.indexOf(n)===-1) all.push(n); });
    var dl=document.getElementById('whoList'); dl.innerHTML='';
    all.forEach(function(n){ var o=document.createElement('option'); o.value=n; dl.appendChild(o); });
  }

  /* ---- render ---- */
  function findIn(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return arr[i]; } return null; }
  function allEntries(){
    var srv={}; state.entries.forEach(function(e){ srv[e.id]=1; });
    return state.entries.concat(state.pending.filter(function(e){ return !srv[e.id]; }));
  }
  function photoUrl(id, big){ return 'https://drive.google.com/thumbnail?id='+id+'&amp;sz=w'+(big?1600:600); }

  function render(){
    var data = allEntries();
    rebuildFilter(data);
    var f=document.getElementById('filterLoc').value;
    var view = f ? data.filter(function(e){ return e.location===f; }) : data;
    view.sort(function(a,b){ if(a.date!==b.date) return a.date<b.date?1:-1; return (a.created<b.created)?1:-1; });
    document.getElementById('count').textContent = view.length ? (view.length+' רשומות') : '';

    var feed=document.getElementById('feed');
    if(!view.length){ feed.innerHTML='<div class=&quot;empty&quot;>עדיין אין רשומות — הרשומה הראשונה שלכם תופיע כאן ✨</div>'; return; }
    var html=''; var lastDate=null;
    view.forEach(function(e){
      if(e.date!==lastDate){ html+='<div class=&quot;day&quot;>📅 '+heDate(e.date)+'</div>'; lastDate=e.date; }
      html+='<div class=&quot;entry&quot; data-id=&quot;'+esc(e.id)+'&quot;>';
      html+='<div class=&quot;meta&quot;>';
      if(e.location) html+='<span class=&quot;chip loc&quot;>📍 '+esc(e.location)+'</span>';
      if(e.author)   html+='<span class=&quot;chip who&quot;>'+esc(e.author)+'</span>';
      if(e.pending)  html+='<span class=&quot;chip pend&quot;>⏳ ממתין לסנכרון</span>';
      html+='<span class=&quot;acts&quot;><button class=&quot;iconbtn&quot; data-edit=&quot;'+esc(e.id)+'&quot;>✏️ ערוך</button>'+
            '<button class=&quot;iconbtn danger&quot; data-del=&quot;'+esc(e.id)+'&quot;>🗑️ מחק</button></span>';
      html+='</div>';
      if(e.text) html+='<div class=&quot;txt&quot;>'+esc(e.text)+'</div>';
      var imgs = e.pending ? (e.localPhotos||[]).map(function(d){return {src:d,full:d};})
                           : (e.photos||[]).map(function(id){return {src:photoUrl(id,false),full:photoUrl(id,true)};});
      if(imgs.length){ html+='<div class=&quot;grid&quot;>'; imgs.forEach(function(o){ html+='<img loading=&quot;lazy&quot; src=&quot;'+o.src+'&quot; data-full=&quot;'+o.full+'&quot;>'; }); html+='</div>'; }
      html+='</div>';
    });
    feed.innerHTML=html;
    Array.prototype.forEach.call(feed.querySelectorAll('.grid img'), function(im){ im.onclick=function(){ openLB(im.getAttribute('data-full')); }; });
    Array.prototype.forEach.call(feed.querySelectorAll('[data-edit]'), function(b){ b.onclick=function(){ startEdit(b.getAttribute('data-edit')); }; });
    Array.prototype.forEach.call(feed.querySelectorAll('[data-del]'), function(b){ b.onclick=function(){ deleteEntry(b.getAttribute('data-del')); }; });
  }

  function rebuildFilter(data){
    var sel=document.getElementById('filterLoc'); var cur=sel.value;
    var locs=[]; data.forEach(function(e){ if(e.location &amp;&amp; locs.indexOf(e.location)===-1) locs.push(e.location); });
    locs.sort();
    sel.innerHTML='<option value=&quot;&quot;>כל המיקומים</option>'+locs.map(function(l){return '<option>'+esc(l)+'</option>';}).join('');
    if(locs.indexOf(cur)>-1) sel.value=cur;
  }
  document.getElementById('filterLoc').onchange=render;

  document.getElementById('exportBtn').onclick=function(){
    var data={ exported:new Date().toISOString(), entries:allEntries() };
    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='יומן-יפן-2026-גיבוי.json'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  };

  function openLB(src){ document.getElementById('lbImg').src=src; document.getElementById('lb').classList.add('open'); }
  document.getElementById('lbX').onclick=function(){ document.getElementById('lb').classList.remove('open'); document.getElementById('lbImg').src=''; };
  document.getElementById('lb').onclick=function(e){ if(e.target.id==='lb'){ this.classList.remove('open'); document.getElementById('lbImg').src=''; } };

  function esc(s){ return String(s).replace(/[&amp;<>&quot;]/g,function(c){return {'&amp;':'&amp;amp;','<':'&amp;lt;','>':'&amp;gt;','&quot;':'&amp;quot;'}[c];}); }
  function heDate(v){
    var s=String(v||''); var days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    var d;
    if(m){ d=new Date(+m[1], +m[2]-1, +m[3]); }
    else { d=new Date(s); }
    if(isNaN(d.getTime())) return s;
    return 'יום '+days[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();
  }
  function copy(t){ if(navigator.clipboard&amp;&amp;navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast('הקישור הועתק ✓');},function(){prompt('העתק את הקישור:',t);}); } else prompt('העתק את הקישור:',t); }
  var toastT;
  function toast(m){ var el=document.getElementById('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove('show');},2200); }

  init();
})();
</script>
</body>
