<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ין לשקל 🇯🇵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FDF6EE;
    --indigo:#2B3A67;
    --coral:#FF6B4A;
    --mint:#3FAE7A;
    --gold:#F2B84B;
    --indigo-soft:#5A6A9A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--cream);
    font-family:'Nunito',sans-serif;
    color:var(--indigo);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }
  .header{
    text-align:center;
    padding:18px 16px 8px;
  }
  .header h1{
    font-family:'Fredoka',sans-serif;
    font-size:22px;
    margin:0;
    letter-spacing:.3px;
  }
  .header .sub{
    font-size:13px;
    color:var(--indigo-soft);
    margin-top:2px;
    font-weight:700;
  }

  /* Departure-board style readout */
  .board{
    margin:10px 16px 2px;
    background:var(--indigo);
    border-radius:18px;
    padding:18px 16px 20px;
    box-shadow:0 8px 0 rgba(43,58,103,0.15);
    position:relative;
  }
  .board::before{
    content:"";
    position:absolute; inset:0;
    border-radius:18px;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 4px);
    pointer-events:none;
  }
  .row-label{
    font-size:12px;
    color:#B9C3E0;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:2px;
  }
  .yen-line{
    display:flex;
    align-items:baseline;
    gap:6px;
    justify-content:flex-end;
  }
  .yen-symbol{
    font-family:'Fredoka',sans-serif;
    font-size:22px;
    color:var(--gold);
  }
  .flip-wrap{
    display:flex;
    direction:ltr;
    gap:2px;
    justify-content:flex-end;
  }
  .digit{
    font-family:'Fredoka',sans-serif;
    font-size:38px;
    font-weight:600;
    line-height:1.15;
    color:#fff;
    background:rgba(255,255,255,0.06);
    border-radius:6px;
    padding:2px 4px;
    min-width:26px;
    text-align:center;
    display:inline-block;
    transition:transform .18s ease;
  }
  .digit.pop{ transform:translateY(-4px); }
  .comma{
    font-family:'Fredoka',sans-serif;
    font-size:38px;
    color:#B9C3E0;
    align-self:flex-end;
  }

  .arrow{
    display:flex;
    justify-content:center;
    margin:10px 0;
  }
  .arrow span{
    background:rgba(242,184,75,0.15);
    color:var(--gold);
    font-weight:800;
    font-size:13px;
    letter-spacing:.5px;
    padding:4px 14px;
    border-radius:999px;
  }

  .result-line{
    display:flex;
    align-items:baseline;
    gap:6px;
    justify-content:flex-end;
  }
  .shekel-symbol{
    font-family:'Fredoka',sans-serif;
    font-size:26px;
    color:var(--mint);
  }
  .flip-wrap.result .digit{
    color:var(--mint);
    background:rgba(63,174,122,0.12);
    font-size:44px;
  }

  .rate-line{
    margin-top:10px;
    text-align:center;
    font-size:11.5px;
    color:#B9C3E0;
    font-weight:700;
    cursor:pointer;
    padding:4px;
  }
  .rate-line.stale{ color:var(--gold); }

  /* Keypad */
  .pad-area{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    padding:8px 14px 14px;
    gap:8px;
  }
  .keypad{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
  }
  .key{
    font-family:'Fredoka',sans-serif;
    font-size:19px;
    font-weight:600;
    background:#fff;
    color:var(--indigo);
    border:none;
    border-radius:12px;
    padding:11px 0;
    box-shadow:0 3px 0 rgba(43,58,103,0.12);
    user-select:none;
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .key:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(43,58,103,0.12); }
  .key.clear{ background:#FFE3DA; color:var(--coral); font-size:14px; }
  .key.back{ background:#FFE3DA; color:var(--coral); font-size:17px; }
  .key.zero{ grid-column: span 1; }

  .camera-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--coral);
    color:#fff;
    font-family:'Fredoka',sans-serif;
    font-size:15px;
    font-weight:600;
    border:none;
    border-radius:14px;
    padding:12px 0;
    box-shadow:0 4px 0 rgba(255,107,74,0.3);
    width:100%;
  }
  .camera-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(255,107,74,0.3); }

  /* OCR confirm sheet */
  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(43,58,103,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    background:var(--cream);
    width:100%;
    max-width:480px;
    border-radius:22px 22px 0 0;
    padding:20px 20px 26px;
    text-align:center;
  }
  .sheet h3{
    font-family:'Fredoka',sans-serif;
    margin:0 0 6px;
    font-size:18px;
  }
  .sheet p{
    font-size:13px;
    color:var(--indigo-soft);
    margin:0 0 14px;
    font-weight:700;
  }
  .sheet input{
    width:100%;
    font-family:'Fredoka',sans-serif;
    font-size:32px;
    text-align:center;
    border:2px solid var(--gold);
    border-radius:12px;
    padding:10px;
    color:var(--indigo);
    background:#fff;
    direction:ltr;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .sheet-actions button{
    flex:1;
    padding:14px 0;
    border-radius:14px;
    border:none;
    font-family:'Fredoka',sans-serif;
    font-size:15px;
    font-weight:600;
  }
  .sheet-actions .use{ background:var(--mint); color:#fff; }
  .sheet-actions .cancel{ background:#EDE6DA; color:var(--indigo-soft); }

  .scanning{
    font-size:13px;
    color:var(--indigo-soft);
    font-weight:700;
  }
  .spinner{
    width:22px;height:22px;
    border:3px solid #EDE6DA;
    border-top-color:var(--coral);
    border-radius:50%;
    display:inline-block;
    animation:spin 0.8s linear infinite;
    vertical-align:middle;
    margin-left:8px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .camera-btn-wrap{
    position:relative;
    width:100%;
  }
  .camera-btn-wrap input[type=file]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
    z-index:1;
  }
</style>
</head>
<body>

<div class="header">
  <h1>כמה זה בשקלים? 🇯🇵</h1>
  <div class="sub">הקלידו את המחיר בין, או צלמו את התווית</div>
</div>

<div class="board">
  <div class="row-label">מחיר בין</div>
  <div class="yen-line">
    <div class="flip-wrap" id="yenDigits">
      <span class="digit">0</span>
    </div>
    <span class="yen-symbol">円</span>
  </div>

  <div class="arrow"><span>שווה ערך ל</span></div>

  <div class="result-line">
    <div class="flip-wrap result" id="ilsDigits">
      <span class="digit">0.00</span>
    </div>
    <span class="shekel-symbol">₪</span>
  </div>

  <div class="rate-line" id="rateLine">בודק שער חליפין…</div>
</div>

<div class="pad-area">
  <div class="camera-btn-wrap">
    <div class="camera-btn" id="cameraBtn">📷 צלמו תווית מחיר</div>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
  </div>
  <div class="keypad" id="keypad">
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key clear" data-k="clear">נקה</button>
    <button class="key zero" data-k="0">0</button>
    <button class="key back" data-k="back">⌫</button>
  </div>
</div>

<div class="sheet-overlay" id="sheet">
  <div class="sheet">
    <h3 id="sheetTitle">מזהה מספר…</h3>
    <p id="sheetSub">רגע אחד</p>
    <div id="sheetBody">
      <span class="scanning">סורק תמונה<span class="spinner"></span></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<script>
(function(){
  var yen = 0;
  var rate = null;      // ILS per 1 JPY
  var rateIsStale = false;
  var rateTimestamp = null;

  var yenDigitsEl = document.getElementById('yenDigits');
  var ilsDigitsEl = document.getElementById('ilsDigits');
  var rateLineEl = document.getElementById('rateLine');

  function formatWithCommas(n){
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function renderFlip(container, text, isResult){
    // build spans per character, flip animation on change
    var prev = container.getAttribute('data-prev') || '';
    container.setAttribute('data-prev', text);
    container.innerHTML = '';
    for (var i=0;i<text.length;i++){
      var ch = text[i];
      if(ch===','){
        var c = document.createElement('span');
        c.className='comma';
        c.textContent=',';
        container.appendChild(c);
        continue;
      }
      var d = document.createElement('span');
      d.className='digit';
      d.textContent = ch;
      if (prev[i] !== ch){
        d.classList.add('pop');
        setTimeout(function(el){ return function(){ el.classList.remove('pop'); }; }(d), 180);
      }
      container.appendChild(d);
    }
  }

  function update(){
    renderFlip(yenDigitsEl, formatWithCommas(yen), false);
    var ils = yen * rate;
    renderFlip(ilsDigitsEl, formatWithCommas(Math.round(ils)), true);
  }

  document.getElementById('keypad').addEventListener('click', function(e){
    var btn = e.target.closest('.key');
    if(!btn) return;
    var k = btn.getAttribute('data-k');
    if (k==='clear'){ yen = 0; }
    else if (k==='back'){ yen = Math.floor(yen/10); }
    else {
      // cap so numbers stay sane (max 999,999 yen)
      var next = yen*10 + parseInt(k,10);
      if (next <= 999999) yen = next;
    }
    update();
  });

  // ---------- Exchange rate ----------
  // Built-in default so the app ALWAYS works, even offline or if the
  // app's browser view blocks outside network calls.
  var DEFAULT_RATE = 0.0186;      // ~1 JPY in ILS, set 01.07.2026
  var DEFAULT_DATE  = '01.07.2026';

  rate = DEFAULT_RATE;
  rateTimestamp = null; // null = using built-in default, not a live fetch
  showRateLine();
  update();

  async function loadRate(){
    try {
      var res = await fetch('https://api.frankfurter.app/latest?from=JPY&to=ILS');
      var data = await res.json();
      if (data && data.rates && data.rates.ILS){
        rate = data.rates.ILS;
        rateTimestamp = new Date();
        showRateLine();
        update();
      }
    } catch(err){
      // Network call blocked or offline — keep using DEFAULT_RATE, already shown.
    }
  }

  function showRateLine(){
    if (rateTimestamp){
      var dateStr = rateTimestamp.toLocaleDateString('he-IL');
      rateLineEl.innerHTML = '1 ין = ' + rate.toFixed(4) + ' ₪ · שער עדכני מ-' + dateStr + ' <u>(שנו)</u>';
      rateLineEl.classList.remove('stale');
    } else {
      rateLineEl.innerHTML = '1 ין ≈ ' + rate.toFixed(4) + ' ₪ · שער משוער מ-' + DEFAULT_DATE + ' <u>(שנו)</u>';
      rateLineEl.classList.add('stale');
    }
  }

  rateLineEl.addEventListener('click', function(){
    var input = prompt('הזינו שער עדכני: כמה שקלים שווה 1 ין?', rate.toFixed(4));
    if (input){
      var val = parseFloat(input.replace(',', '.'));
      if (!isNaN(val) && val > 0 && val < 1){
        rate = val;
        rateTimestamp = new Date();
        showRateLine();
        update();
      }
    }
  });

  loadRate();

  // ---------- Camera + OCR ----------
  var fileInput = document.getElementById('fileInput');
  var sheet = document.getElementById('sheet');
  var sheetTitle = document.getElementById('sheetTitle');
  var sheetSub = document.getElementById('sheetSub');
  var sheetBody = document.getElementById('sheetBody');

  // Camera button: the real <input type=file> sits transparently on top
  // of the styled button, so a tap always hits the actual input directly.

  fileInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    openScanningSheet();
    var reader = new FileReader();
    reader.onload = function(ev){
      runOCR(ev.target.result);
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  function openScanningSheet(){
    sheetTitle.textContent = 'מזהה מספר…';
    sheetSub.textContent = 'רגע אחד';
    sheetBody.innerHTML = '<span class="scanning">סורק תמונה<span class="spinner"></span></span>';
    sheet.classList.add('show');
  }

  function closeSheet(){
    sheet.classList.remove('show');
  }

  async function runOCR(dataUrl){
    try {
      var result = await Tesseract.recognize(dataUrl, 'jpn+eng', { logger: function(){} });
      var text = result.data.text || '';
      // pull all number groups, pick the longest (usually the price)
      var matches = text.match(/[0-9][0-9,\.]*[0-9]|[0-9]/g) || [];
      var candidates = matches
        .map(function(m){ return m.replace(/[,\.]/g,''); })
        .filter(function(m){ return m.length>0 && m.length<=6; })
        .sort(function(a,b){ return b.length - a.length; });

      var guess = candidates.length ? candidates[0] : '';
      showConfirmSheet(guess);
    } catch(err){
      showConfirmSheet('');
    }
  }

  function showConfirmSheet(guess){
    sheetTitle.textContent = guess ? 'זה המספר?' : 'לא הצלחתי לזהות';
    sheetSub.textContent = guess
      ? 'בדקו שהמספר נכון, אפשר לתקן ולאשר'
      : 'הקלידו את המחיר בין בעצמכם';
    sheetBody.innerHTML =
      '<input type="text" inputmode="numeric" id="ocrInput" maxlength="6" value="'+guess+'" placeholder="0">' +
      '<div class="sheet-actions">' +
        '<button class="cancel" id="ocrCancel">ביטול</button>' +
        '<button class="use" id="ocrUse">אישור</button>' +
      '</div>';

    document.getElementById('ocrCancel').addEventListener('click', closeSheet);
    document.getElementById('ocrUse').addEventListener('click', function(){
      var val = document.getElementById('ocrInput').value.replace(/[^0-9]/g,'');
      if (val){
        yen = Math.min(parseInt(val,10), 999999);
        update();
      }
      closeSheet();
    });
  }

  update();
})();
</script>
</body>
</html>
